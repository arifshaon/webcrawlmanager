name: Release SWM 1.0 for Windows

on:
  push:
    branches:
      - feature/record-session
    paths:
      - '.github/workflows/release-windows-1.0.yml'
      - 'install/SWM-Setup-1.0.zip'
      - 'install/SWM-Setup-1.0.ps1'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  SWM_VERSION: '1.0'
  SWM_TAG: 'v1.0'
  SOURCE_BRANCH: 'feature/record-session'
  BASE_ZIP_SHA256: 'faa2d0dfe2392df13576e1ca1e1e7ea9198ca4cd4e12dbd71c50791b5424b7bb'

jobs:
  build-sign-attest-release:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          ref: feature/record-session
          fetch-depth: 0

      - name: Ensure exact SWM 1.0 baseline copy exists
        id: baseline
        shell: powershell
        run: |
          $source = '.\install\SWM-Setup-0.5.2.zip'
          $target = '.\install\SWM-Setup-1.0.zip'

          if (-not (Test-Path -LiteralPath $source)) {
            throw "Missing source baseline package: $source"
          }

          $sourceHash = (Get-FileHash -LiteralPath $source -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($sourceHash -ne $env:BASE_ZIP_SHA256) {
            throw "0.5.2 baseline does not match the approved upload. Expected $env:BASE_ZIP_SHA256 but got $sourceHash."
          }

          if (-not (Test-Path -LiteralPath $target)) {
            Copy-Item -LiteralPath $source -Destination $target
            $targetHash = (Get-FileHash -LiteralPath $target -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($targetHash -ne $sourceHash) {
              throw "The 1.0 copy is not byte-identical to the 0.5.2 baseline."
            }

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- $target
            git commit -m "Add exact SWM 1.0 baseline copy"
            git push origin HEAD:feature/record-session

            "created=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            Write-Host "Committed exact binary copy as install/SWM-Setup-1.0.zip."
            exit 0
          }

          $targetHash = (Get-FileHash -LiteralPath $target -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($targetHash -ne $sourceHash) {
            throw "install/SWM-Setup-1.0.zip is not byte-identical to the approved 0.5.2 baseline."
          }

          "created=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Verified exact 1.0 baseline copy: $targetHash"

      - name: Validate installer scripts
        if: steps.baseline.outputs.created != 'true'
        shell: powershell
        run: |
          foreach ($script in @('.\install\install-windows.ps1', '.\install\run-bootstrap.ps1', '.\install\SWM-Setup-1.0.ps1')) {
            $text = Get-Content -LiteralPath $script -Raw
            [void][scriptblock]::Create($text)
          }
          if (-not (Test-Path -LiteralPath '.\install\SWM-Windows-Setup.iss')) {
            throw 'Inno Setup definition is missing.'
          }

          $engineHash = (Get-FileHash -LiteralPath '.\install\install-windows.ps1' -Algorithm SHA256).Hash
          $plainHash = (Get-FileHash -LiteralPath '.\install\SWM-Setup-1.0.ps1' -Algorithm SHA256).Hash
          if ($engineHash -ne $plainHash) {
            throw 'SWM-Setup-1.0.ps1 is not an exact copy of the proven install-windows.ps1 engine.'
          }
          Write-Host "Verified one-file PowerShell installer is byte-identical to install-windows.ps1: $plainHash"

      - name: Install Inno Setup 6
        if: steps.baseline.outputs.created != 'true'
        shell: powershell
        run: |
          choco install innosetup -y --no-progress
          $pf86 = [Environment]::GetFolderPath('ProgramFilesX86')
          $iscc = Join-Path $pf86 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path -LiteralPath $iscc)) {
            $iscc = Join-Path $env:ProgramFiles 'Inno Setup 6\ISCC.exe'
          }
          if (-not (Test-Path -LiteralPath $iscc)) {
            throw 'Inno Setup 6 compiler was not found.'
          }
          "ISCC=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build SWM 1.0 installer
        if: steps.baseline.outputs.created != 'true'
        shell: powershell
        run: |
          $unsignedDir = Join-Path $env:RUNNER_TEMP 'swm-1.0-unsigned'
          New-Item -ItemType Directory -Path $unsignedDir -Force | Out-Null

          & $env:ISCC '/Qp' "/DAppVersion=$env:SWM_VERSION" "/DSourceBranch=$env:SOURCE_BRANCH" "/O$unsignedDir" '.\install\SWM-Windows-Setup.iss'
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup failed with exit code $LASTEXITCODE."
          }

          $exe = Join-Path $unsignedDir "SWM-Setup-$env:SWM_VERSION.exe"
          if (-not (Test-Path -LiteralPath $exe)) {
            throw "Expected installer was not created: $exe"
          }

          $sig = Get-AuthenticodeSignature -FilePath $exe
          if ($sig.Status -eq 'Valid') {
            throw 'Build unexpectedly produced an already-signed installer.'
          }

          "UNSIGNED_EXE=$exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Built unsigned installer: $exe"

      - name: Create self-signed code-signing certificate
        if: steps.baseline.outputs.created != 'true'
        shell: powershell
        run: |
          $releaseDir = Join-Path $PWD 'release'
          New-Item -ItemType Directory -Path $releaseDir -Force | Out-Null

          $openssl = Get-Command openssl.exe -ErrorAction SilentlyContinue
          if (-not $openssl) {
            $gitOpenSSL = 'C:\Program Files\Git\usr\bin\openssl.exe'
            if (Test-Path -LiteralPath $gitOpenSSL) {
              $openssl = Get-Item -LiteralPath $gitOpenSSL
            }
          }
          if (-not $openssl) {
            choco install openssl -y --no-progress
            $openssl = Get-Command openssl.exe -ErrorAction SilentlyContinue
          }
          if (-not $openssl) {
            throw 'OpenSSL was not found on the runner.'
          }

          $certWork = Join-Path $env:RUNNER_TEMP 'swm-self-sign'
          New-Item -ItemType Directory -Path $certWork -Force | Out-Null

          $keyPath = Join-Path $certWork 'swm-code-signing.key.pem'
          $pemPath = Join-Path $certWork 'swm-code-signing.cert.pem'
          $pfxPath = Join-Path $certWork 'swm-code-signing.pfx'
          $cerPath = Join-Path $releaseDir 'SWM-1.0-self-signed-code-signing.cer'
          $pfxPassword = ([guid]::NewGuid().ToString('N') + [guid]::NewGuid().ToString('N'))
          Write-Host "::add-mask::$pfxPassword"

          & $openssl.Source req -x509 -newkey rsa:2048 -sha256 -days 1825 -nodes -keyout $keyPath -out $pemPath -subj '/CN=Simple Webcrawl Manager/O=Arif Shaon' -addext 'keyUsage=critical,digitalSignature' -addext 'extendedKeyUsage=codeSigning'
          if ($LASTEXITCODE -ne 0) {
            throw "OpenSSL certificate creation failed with exit code $LASTEXITCODE."
          }

          & $openssl.Source pkcs12 -export -out $pfxPath -inkey $keyPath -in $pemPath -passout "pass:$pfxPassword" -name 'Simple Webcrawl Manager 1.0'
          if ($LASTEXITCODE -ne 0) {
            throw "OpenSSL PFX creation failed with exit code $LASTEXITCODE."
          }

          & $openssl.Source x509 -in $pemPath -outform DER -out $cerPath
          if ($LASTEXITCODE -ne 0) {
            throw "OpenSSL CER export failed with exit code $LASTEXITCODE."
          }

          "PFX_PATH=$pfxPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PFX_PASSWORD=$pfxPassword" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CERT_PATH=$cerPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          & $openssl.Source x509 -in $pemPath -noout -subject -fingerprint -sha256

      - name: Self-sign SWM 1.0 installer
        if: steps.baseline.outputs.created != 'true'
        shell: powershell
        run: |
          $pf86 = [Environment]::GetFolderPath('ProgramFilesX86')
          $signTool = Get-ChildItem -Path (Join-Path $pf86 'Windows Kits\10\bin') -Filter signtool.exe -File -Recurse -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match '\\x64\\signtool\.exe$' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1

          if (-not $signTool) {
            throw 'Windows SDK signtool.exe was not found on the runner.'
          }

          $signedExe = Join-Path $PWD "release\SWM-Setup-$env:SWM_VERSION.exe"
          Copy-Item -LiteralPath $env:UNSIGNED_EXE -Destination $signedExe -Force

          & $signTool.FullName sign /f $env:PFX_PATH /p $env:PFX_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /d "Simple Webcrawl Manager $env:SWM_VERSION" /du https://github.com/arifshaon/webcrawlmanager $signedExe
          if ($LASTEXITCODE -ne 0) {
            throw "Authenticode signing failed with exit code $LASTEXITCODE."
          }

          $sig = Get-AuthenticodeSignature -FilePath $signedExe
          if (-not $sig.SignerCertificate) {
            throw 'The built EXE does not contain an Authenticode signer certificate.'
          }
          if ($sig.Status -eq 'NotSigned' -or $sig.Status -eq 'HashMismatch') {
            throw "Authenticode verification failed: $($sig.Status) - $($sig.StatusMessage)"
          }
          if ($sig.SignerCertificate.Subject -notlike '*CN=Simple Webcrawl Manager*') {
            throw "Unexpected Authenticode signer: $($sig.SignerCertificate.Subject)"
          }

          "SIGNED_EXE=$signedExe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Signed installer: $signedExe"
          Write-Host "Publisher: $($sig.SignerCertificate.Subject)"
          Write-Host "Signature status on an untrusted self-signed chain: $($sig.Status)"
          if ($sig.TimeStamperCertificate) {
            Write-Host "Timestamp signer: $($sig.TimeStamperCertificate.Subject)"
          }

      - name: Package signed installer and generate SHA-256
        if: steps.baseline.outputs.created != 'true'
        shell: powershell
        run: |
          $releaseDir = Join-Path $PWD 'release'
          $zipPath = Join-Path $releaseDir "SWM-Setup-$env:SWM_VERSION.zip"
          $psPath = Join-Path $releaseDir "SWM-Setup-$env:SWM_VERSION.ps1"
          $hashPath = Join-Path $releaseDir 'SHA256SUMS.txt'

          Copy-Item -LiteralPath '.\install\SWM-Setup-1.0.ps1' -Destination $psPath -Force

          if (Test-Path -LiteralPath $zipPath) {
            Remove-Item -LiteralPath $zipPath -Force
          }

          Compress-Archive -LiteralPath $env:SIGNED_EXE -DestinationPath $zipPath -CompressionLevel Optimal

          $exeHash = (Get-FileHash -LiteralPath $env:SIGNED_EXE -Algorithm SHA256).Hash.ToLowerInvariant()
          $zipHash = (Get-FileHash -LiteralPath $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
          $psHash = (Get-FileHash -LiteralPath $psPath -Algorithm SHA256).Hash.ToLowerInvariant()
          $certHash = (Get-FileHash -LiteralPath $env:CERT_PATH -Algorithm SHA256).Hash.ToLowerInvariant()

          @(
            "$exeHash  SWM-Setup-$env:SWM_VERSION.exe",
            "$zipHash  SWM-Setup-$env:SWM_VERSION.zip",
            "$psHash  SWM-Setup-$env:SWM_VERSION.ps1",
            "$certHash  SWM-1.0-self-signed-code-signing.cer"
          ) | Set-Content -LiteralPath $hashPath -Encoding ascii

          "SIGNED_ZIP=$zipPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PLAIN_PS1=$psPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "HASH_FILE=$hashPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "EXE_SHA256=$exeHash" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ZIP_SHA256=$zipHash" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PS1_SHA256=$psHash" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          Write-Host "EXE SHA-256: $exeHash"
          Write-Host "ZIP SHA-256: $zipHash"
          Write-Host "PS1 SHA-256: $psHash"

      - name: Attest signed EXE provenance
        if: steps.baseline.outputs.created != 'true'
        uses: actions/attest@v4
        with:
          subject-path: release/SWM-Setup-1.0.exe

      - name: Attest signed ZIP provenance
        if: steps.baseline.outputs.created != 'true'
        uses: actions/attest@v4
        with:
          subject-path: release/SWM-Setup-1.0.zip

      - name: Attest one-file PowerShell installer provenance
        if: steps.baseline.outputs.created != 'true'
        uses: actions/attest@v4
        with:
          subject-path: release/SWM-Setup-1.0.ps1

      - name: Verify GitHub attestation
        if: steps.baseline.outputs.created != 'true'
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh attestation verify "release\SWM-Setup-$env:SWM_VERSION.exe" --repo $env:GITHUB_REPOSITORY

      - name: Create release notes
        if: steps.baseline.outputs.created != 'true'
        shell: powershell
        run: |
          $notesPath = Join-Path $PWD 'release\RELEASE_NOTES.md'
          @(
            '# Simple Webcrawl Manager 1.0',
            '',
            'Windows release built from feature/record-session by GitHub Actions.',
            '',
            'Security and provenance:',
            '- Authenticode self-signed as Simple Webcrawl Manager / Arif Shaon.',
            '- RFC 3161 timestamp applied.',
            '- SHA-256 checksums are included in SHA256SUMS.txt.',
            '- GitHub artifact attestations are published for the signed EXE, ZIP, and one-file PowerShell installer.',
            '- SWM-Setup-1.0.ps1 is a byte-identical copy of the proven PowerShell installation engine used by the EXE.',
            '- The public signing certificate is attached.',
            '',
            'Important: this is a self-signed Authenticode certificate. Windows does not trust it by default, so it does not provide the same SmartScreen publisher trust as a commercial CA-issued certificate.',
            '',
            "EXE SHA-256: $env:EXE_SHA256",
            "ZIP SHA-256: $env:ZIP_SHA256",
            "PS1 SHA-256: $env:PS1_SHA256",
            '',
            'Verify GitHub provenance:',
            'gh attestation verify SWM-Setup-1.0.exe --repo arifshaon/webcrawlmanager'
          ) | Set-Content -LiteralPath $notesPath -Encoding utf8

          "RELEASE_NOTES=$notesPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Publish GitHub Release v1.0
        if: steps.baseline.outputs.created != 'true'
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(
            "release\SWM-Setup-$env:SWM_VERSION.exe",
            "release\SWM-Setup-$env:SWM_VERSION.zip",
            "release\SWM-Setup-$env:SWM_VERSION.ps1",
            'release\SHA256SUMS.txt',
            'release\SWM-1.0-self-signed-code-signing.cer'
          )

          $previousErrorAction = $ErrorActionPreference
          $ErrorActionPreference = 'SilentlyContinue'
          gh release view $env:SWM_TAG --repo $env:GITHUB_REPOSITORY --json tagName *> $null
          $releaseExists = ($LASTEXITCODE -eq 0)
          $ErrorActionPreference = $previousErrorAction

          if ($releaseExists) {
            gh release edit $env:SWM_TAG --repo $env:GITHUB_REPOSITORY --title 'Simple Webcrawl Manager 1.0' --notes-file $env:RELEASE_NOTES
            if ($LASTEXITCODE -ne 0) { throw 'Could not update the existing v1.0 release.' }

            gh release upload $env:SWM_TAG @assets --repo $env:GITHUB_REPOSITORY --clobber
            if ($LASTEXITCODE -ne 0) { throw 'Could not upload assets to the existing v1.0 release.' }
          } else {
            gh release create $env:SWM_TAG @assets --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title 'Simple Webcrawl Manager 1.0' --notes-file $env:RELEASE_NOTES
            if ($LASTEXITCODE -ne 0) { throw 'Could not create the v1.0 release.' }
          }

      - name: Upload release bundle as workflow artifact
        if: steps.baseline.outputs.created != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: SWM-1.0-signed-windows-release
          path: |
            release/SWM-Setup-1.0.exe
            release/SWM-Setup-1.0.zip
            release/SWM-Setup-1.0.ps1
            release/SHA256SUMS.txt
            release/SWM-1.0-self-signed-code-signing.cer
            release/RELEASE_NOTES.md
          if-no-files-found: error
          retention-days: 30
