name: Build unsigned Windows installer

on:
  push:
    branches:
      - feature/record-session
    paths:
      - 'install/**'
      - 'pyproject.toml'
      - '.github/workflows/build-unsigned-windows-installer.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: feature/record-session

      - name: Parse PowerShell bootstrap
        shell: powershell
        run: |
          $text = Get-Content .\install\install-windows.ps1 -Raw
          [void][scriptblock]::Create($text)
          Write-Host 'PowerShell bootstrap syntax is valid.'

      - name: Smoke test private-runtime bootstrap
        shell: powershell
        run: |
          $testDir = Join-Path $env:RUNNER_TEMP 'swm-private-runtime-test'
          if (Test-Path $testDir) { Remove-Item $testDir -Recurse -Force }

          .\install\install-windows.ps1 `
            -InstallDir $testDir `
            -Branch feature/record-session `
            -DashboardPort 18080 `
            -ReplayPort 18091 `
            -Yes

          $required = @(
            (Join-Path $testDir '.runtime\uv\uv.exe'),
            (Join-Path $testDir '.runtime\python'),
            (Join-Path $testDir '.venv\Scripts\python.exe'),
            (Join-Path $testDir '.venv\Scripts\swm.exe'),
            (Join-Path $testDir 'Start SWM Server.cmd'),
            (Join-Path $testDir 'swm.cmd'),
            (Join-Path $testDir 'server-port.txt')
          )
          foreach ($path in $required) {
            if (-not (Test-Path $path)) { throw "Bootstrap did not create: $path" }
          }

          $port = (Get-Content (Join-Path $testDir 'server-port.txt') -Raw).Trim()
          if ($port -ne '18080') { throw "Unexpected server port: $port" }

          $privatePython = & (Join-Path $testDir '.venv\Scripts\python.exe') -c "import sys; print(sys.version.split()[0])"
          Write-Host "Private Python: $privatePython"
          & (Join-Path $testDir '.venv\Scripts\swm.exe') --help | Select-Object -First 8
          if ($LASTEXITCODE -ne 0) { throw 'Installed SWM CLI smoke test failed.' }

      - name: Install Inno Setup 6
        shell: powershell
        run: |
          choco install innosetup -y --no-progress
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            $iscc = Join-Path $env:ProgramFiles 'Inno Setup 6\ISCC.exe'
          }
          if (-not (Test-Path $iscc)) {
            throw 'Inno Setup 6 compiler was not found after installation.'
          }
          Write-Host "ISCC=$iscc"

      - name: Build unsigned installer
        shell: powershell
        run: |
          .\install\build-windows-installer.ps1 -Branch feature/record-session -AllowUnsigned

      - name: Verify installer exists and is unsigned
        shell: powershell
        run: |
          $exe = Get-ChildItem .\install\dist\SWM-Setup-*.exe | Select-Object -First 1
          if (-not $exe) {
            throw 'Installer EXE was not created.'
          }
          $sig = Get-AuthenticodeSignature -FilePath $exe.FullName
          Write-Host "Installer: $($exe.FullName)"
          Write-Host "Signature status: $($sig.Status)"
          if ($sig.Status -eq 'Valid') {
            throw 'Testing workflow unexpectedly produced a signed installer.'
          }

      - name: Upload unsigned installer
        uses: actions/upload-artifact@v4
        with:
          name: SWM-unsigned-windows-installer
          path: install/dist/SWM-Setup-*.exe
          if-no-files-found: error
          retention-days: 14
