name: Build unsigned Windows installer

on:
  push:
    branches:
      - feature/record-session
    paths:
      - 'install/*.ps1'
      - 'install/*.iss'
      - 'install/README.md'
      - 'pyproject.toml'
      - '.github/workflows/build-unsigned-windows-installer.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: feature/record-session

      - name: Validate installer architecture
        shell: powershell
        run: |
          $text = Get-Content .\install\install-windows.ps1 -Raw
          [void][scriptblock]::Create($text)

          $wrapperText = Get-Content .\install\run-bootstrap.ps1 -Raw
          [void][scriptblock]::Create($wrapperText)

          if ($text -match 'RuntimeRoot\s*=\s*\(Join-Path\s+\$env:LOCALAPPDATA') {
            throw 'Python runtime must not be stored in a separate LocalAppData runtime.'
          }
          if ($text -match '\.venv') {
            throw 'Windows installer must use the local SWM Python directly, not a separate venv.'
          }
          if ($text -notmatch 'Join-Path\s+\$InstallDir\s+"\.runtime"') {
            throw 'Installer does not derive .runtime from InstallDir.'
          }
          if ($text -notmatch '%~dp0\.runtime\\python\\python\.exe') {
            throw 'Generated launchers do not explicitly reference the Python inside the install directory.'
          }
          if ($wrapperText -notmatch 'SourceZip') {
            throw 'Bootstrap wrapper does not accept the bundled source archive.'
          }

          Write-Host 'Installer architecture is self-contained and accepts a bundled source snapshot.'

      - name: Smoke test self-contained runtime bootstrap
        shell: powershell
        run: |
          $testDir = Join-Path $env:RUNNER_TEMP 'swm-self-contained-test'
          $sourceStage = Join-Path $env:RUNNER_TEMP 'swm-installer-source-stage'
          $sourceZip = Join-Path $env:RUNNER_TEMP 'SWM-source-test.zip'
          foreach ($path in @($testDir, $sourceStage, $sourceZip)) {
            if (Test-Path $path) { Remove-Item $path -Recurse -Force }
          }

          New-Item -ItemType Directory -Path $sourceStage -Force | Out-Null
          foreach ($name in @('pyproject.toml', 'README.md', 'LICENSE', 'config.yaml')) {
            Copy-Item -LiteralPath (Join-Path $PWD $name) -Destination (Join-Path $sourceStage $name) -Force
          }
          Copy-Item -LiteralPath (Join-Path $PWD 'webarc') -Destination (Join-Path $sourceStage 'webarc') -Recurse -Force
          Compress-Archive -Path (Join-Path $sourceStage '*') -DestinationPath $sourceZip -CompressionLevel Optimal

          $bootstrapArgs = @(
            '-NoLogo', '-NoProfile', '-ExecutionPolicy', 'Bypass',
            '-File', (Resolve-Path '.\install\install-windows.ps1').Path,
            '-InstallDir', $testDir,
            '-Branch', 'feature/record-session',
            '-SourceZip', $sourceZip,
            '-DashboardPort', '18080',
            '-ReplayPort', '18091',
            '-Yes'
          )
          & powershell.exe @bootstrapArgs
          $bootstrapExit = $LASTEXITCODE
          if ($bootstrapExit -ne 0) {
            throw "Bootstrap failed with exit code $bootstrapExit."
          }

          $runtimeRoot = Join-Path $testDir '.runtime'
          $pythonExe = Join-Path $runtimeRoot 'python\python.exe'
          $required = @(
            $pythonExe,
            (Join-Path $runtimeRoot 'uv\uv.exe'),
            (Join-Path $runtimeRoot 'ms-playwright'),
            (Join-Path $testDir 'Start SWM Server.cmd'),
            (Join-Path $testDir 'swm.cmd'),
            (Join-Path $testDir 'server-port.txt')
          )
          foreach ($path in $required) {
            if (-not (Test-Path $path)) { throw "Bootstrap did not create: $path" }
          }

          if (Test-Path (Join-Path $testDir '.venv')) {
            throw 'Bootstrap unexpectedly created a .venv.'
          }

          $version = & $pythonExe -c "import sys; print(sys.version.split()[0])"
          if ($LASTEXITCODE -ne 0 -or $version -notmatch '^3\.13\.') {
            throw "Unexpected local Python runtime: $version"
          }
          Write-Host "Local SWM Python: $version at $pythonExe"

          $helpOutput = & $pythonExe -m webarc.cli --help
          $helpExitCode = $LASTEXITCODE
          $helpOutput | Select-Object -First 8 | ForEach-Object { Write-Host $_ }
          if ($helpExitCode -ne 0) { throw 'Local Python SWM CLI smoke test failed.' }

          & $pythonExe -c "import fastapi, uvicorn, yt_dlp, gallery_dl; print('Installer extras import OK')"
          if ($LASTEXITCODE -ne 0) { throw 'Installer did not install all dashboard/Instagram/YouTube Python dependencies.' }

          $serverLauncher = Get-Content (Join-Path $testDir 'Start SWM Server.cmd') -Raw
          $cliLauncher = Get-Content (Join-Path $testDir 'swm.cmd') -Raw
          foreach ($launcher in @($serverLauncher, $cliLauncher)) {
            if ($launcher -notmatch '%~dp0\.runtime\\python\\python\.exe') {
              throw 'A launcher does not reference the Python runtime relative to its own install directory.'
            }
            if ($launcher -match '\bpython(?:\.exe)?\b' -and $launcher -notmatch 'SWM_PYTHON') {
              throw 'A launcher may invoke an unqualified Python executable.'
            }
          }

          $port = (Get-Content (Join-Path $testDir 'server-port.txt') -Raw).Trim()
          if ($port -ne '18080') { throw "Unexpected server port: $port" }

      - name: Install Inno Setup 6
        shell: powershell
        run: |
          choco install innosetup -y --no-progress
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            $iscc = Join-Path $env:ProgramFiles 'Inno Setup 6\ISCC.exe'
          }
          if (-not (Test-Path $iscc)) {
            throw 'Inno Setup 6 compiler was not found after installation.'
          }
          Write-Host "ISCC=$iscc"

      - name: Build unsigned installer
        shell: powershell
        run: |
          .\install\build-windows-installer.ps1 -Branch feature/record-session -AllowUnsigned

      - name: Verify installer exists and is unsigned
        shell: powershell
        run: |
          $exe = Get-ChildItem .\install\dist\SWM-Setup-*.exe | Select-Object -First 1
          if (-not $exe) {
            throw 'Installer EXE was not created.'
          }
          $sig = Get-AuthenticodeSignature -FilePath $exe.FullName
          Write-Host "Installer: $($exe.FullName)"
          Write-Host "Signature status: $($sig.Status)"
          if ($sig.Status -eq 'Valid') {
            throw 'Testing workflow unexpectedly produced a signed installer.'
          }

      - name: Upload unsigned installer
        uses: actions/upload-artifact@v4
        with:
          name: SWM-unsigned-windows-installer
          path: install/dist/SWM-Setup-*.exe
          if-no-files-found: error
          retention-days: 14
