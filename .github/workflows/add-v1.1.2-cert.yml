name: Add matching v1.1.2 signing certificate

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/add-v1.1.2-cert.yml'

permissions:
  contents: write

jobs:
  add-cert:
    runs-on: windows-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Extract signer certificate from exact installer
        shell: powershell
        run: |
          $exe = '.\install\SWM-Setup-1.1.1.exe'
          $cer = '.\SWM-1.1.2-self-signed-code-signing.cer'

          $expected = '55c7fcba6a38e89efc36a1ec87ede46fa2721d2507307ac660e8f3af42601222'
          $actual = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "Installer hash mismatch. Expected $expected, got $actual."
          }

          $sig = Get-AuthenticodeSignature -FilePath $exe
          if (-not $sig.SignerCertificate) {
            throw 'The installer does not contain an Authenticode signer certificate.'
          }

          Export-Certificate -Cert $sig.SignerCertificate -FilePath $cer -Type CERT | Out-Null

          $certHash = (Get-FileHash -LiteralPath $cer -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "Installer SHA-256: $actual"
          Write-Host "Signer subject: $($sig.SignerCertificate.Subject)"
          Write-Host "Signer thumbprint: $($sig.SignerCertificate.Thumbprint)"
          Write-Host "Certificate SHA-256: $certHash"

      - name: Upload matching public certificate to v1.1.2
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload v1.1.2 '.\SWM-1.1.2-self-signed-code-signing.cer' --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) {
            throw 'Could not upload the matching public certificate.'
          }
