name: Recreate v1.1.2 cleanly

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/recreate-v1.1.2.yml'

permissions:
  contents: write

jobs:
  recreate:
    runs-on: windows-latest
    steps:
      - name: Check out exact main snapshot
        uses: actions/checkout@v4
        with:
          ref: c8316bd19c45ed97a970d0c65d10628450892cdb
          fetch-depth: 0

      - name: Verify installer and extract matching certificate
        shell: powershell
        run: |
          $exe = '.\\install\\SWM-Setup-1.1.1.exe'
          $expected = '55c7fcba6a38e89efc36a1ec87ede46fa2721d2507307ac660e8f3af42601222'
          $actual = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "Installer hash mismatch. Expected $expected, got $actual."
          }

          $sig = Get-AuthenticodeSignature -FilePath $exe
          if (-not $sig.SignerCertificate) {
            throw 'The installer does not contain an Authenticode signer certificate.'
          }

          Export-Certificate -Cert $sig.SignerCertificate -FilePath '.\\SWM-1.1.2-self-signed-code-signing.cer' -Type CERT | Out-Null

      - name: Recreate v1.1.2 release and tag
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v1.1.2 --repo $env:GITHUB_REPOSITORY --cleanup-tag --yes
          if ($LASTEXITCODE -ne 0) {
            throw 'Could not delete the existing v1.1.2 release/tag.'
          }

          @'
          Simple Webcrawl Manager 1.1.2 is an updated Windows distribution based on the current main branch, with an improved installer and smoother setup experience.

          Highlights:
          - Installs from the latest published SWM release by default, with an advanced option to select another GitHub branch.
          - Detects existing installations and supports updating them without replacing the whole local setup.
          - Lets users choose and check the dashboard port during installation.
          - Installs and verifies the required SWM dependencies, including browser, Instagram, YouTube and dashboard components.
          - Makes **Start SWM Server.cmd** the clear, standard way to launch the dashboard after installation.

          The Windows installer included in this release remains **SWM-Setup-1.1.1.exe**.
          '@ | Set-Content -LiteralPath '.\\release-notes.md' -Encoding UTF8

          gh release create v1.1.2 '.\\install\\SWM-Setup-1.1.1.exe' '.\\SWM-1.1.2-self-signed-code-signing.cer' --repo $env:GITHUB_REPOSITORY --target 'c8316bd19c45ed97a970d0c65d10628450892cdb' --title 'Simple Webcrawl Manager 1.1.2' --notes-file '.\\release-notes.md'

          if ($LASTEXITCODE -ne 0) {
            throw 'Could not recreate the v1.1.2 release.'
          }
