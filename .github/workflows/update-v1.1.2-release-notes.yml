name: Update v1.1.2 release notes

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/update-v1.1.2-release-notes.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Update v1.1.2 release description
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          cat > notes.md <<'EOF'
          Simple Webcrawl Manager 1.1.2 is an updated Windows distribution based on the current main branch, with an improved installer and smoother setup experience.

          Highlights:
          - Installs from the latest published SWM release by default, with an advanced option to select another GitHub branch.
          - Detects existing installations and supports updating them without replacing the whole local setup.
          - Lets users choose and check the dashboard port during installation.
          - Installs and verifies the required SWM dependencies, including browser, Instagram, YouTube and dashboard components.
          - Makes **Start SWM Server.cmd** the clear, standard way to launch the dashboard after installation.

          The Windows installer included in this release remains **SWM-Setup-1.1.1.exe**.
          EOF

          gh release edit v1.1.2             --repo "$GITHUB_REPOSITORY"             --notes-file notes.md
