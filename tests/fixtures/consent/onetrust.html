<!doctype html><title>OneTrust</title>
<style>#onetrust-banner-sdk{position:fixed;bottom:0;z-index:2147483645;background:#fff;padding:20px}</style>
<h1>Library</h1>
<div id="onetrust-banner-sdk">
  <button id="onetrust-reject-all-handler">Continue</button>
  <button id="onetrust-accept-btn-handler">Continue</button>
</div>
<script>
for (const id of ["onetrust-reject-all-handler","onetrust-accept-btn-handler"])
  document.getElementById(id).onclick = () =>
    document.getElementById("onetrust-banner-sdk").remove();
</script>
