# Help text for the "?" beside each field on the SWM dashboard.
#
# Each key names a field; the text is shown when the "?" next to that field
# is hovered, focused or tapped. Edit the wording here, or copy this file to
# help_text.yaml next to the dashboard's database (webarc-state/ by default)
# and change only the entries you want: that copy overrides these, entry by
# entry, and is read again each time the dashboard loads. Plain text only;
# keep each entry to a sentence or three.

# Automated crawl
f-crawl-name: >-
  The job's label in the job list and its file names. Something you will recognise later, like the site and the month.
f-operator: >-
  Who is running this job: your library, team or name. Written into the archive so anyone opening it later knows who made it.
f-seeds: >-
  The pages the crawl starts from; it follows links from each within the limits below. One is enough for most sites; add more for sections that do not link to each other.
f-browser-mode: >-
  Headless runs unseen and suits most sites. Choose a visible browser when a site asks you to log in or pass a check.
f-scope-strategy: >-
  How far from the seed the crawl may go. Same host stays on that website; wider choices also follow links to related sites.
f-max-depth: >-
  How many clicks from the seed the crawl may go: 0 saves only the seed page, 1 adds the pages it links to. Keep it small for a quick capture.
f-max-pages: >-
  A ceiling on pages saved per seed, so a large site cannot run for hours.
f-exclude: >-
  URL patterns to skip, one regular expression per line: downloads, log-out links, endless calendars.
f-delay: >-
  A pause before each page, picked at random between these two numbers, so the site is not overloaded and does not block you.
f-page-timeout: >-
  How long to wait for a page to load before moving on. Raise it for slow sites.
f-wait-until: >-
  When a page counts as loaded. Network is idle waits until the page stops fetching, which captures more on pages that keep loading.
f-page-options: >-
  How each page is visited. The usual settings are ticked; change them only if a site needs it.
f-consent-preference: >-
  What to click on cookie banners. The banner is closed either way so the page behind it is captured, and the choice is noted in the record.
f-warc-size: >-
  WARC files are split at this size, so no single file is too big to copy or open.
f-warc-options: >-
  How the WARC files are written.
f-storage: >-
  Where this job's files go. Leave empty for the default folder from Settings; choose a folder when the capture belongs elsewhere, such as an external drive.

# Record session
r-url: >-
  The page the browser opens first. From there you browse by hand, and everything that loads is saved.
r-name: >-
  A label for this recording in the job list and its folder. Left empty, it is taken from the website's name.
r-operator: >-
  Who is running this job: your library, team or name. Written into the archive so anyone opening it later knows who made it.
r-browser: >-
  Which Chrome does the work. Headed, a Chrome SWM manages, is the usual choice. Native attaches to your installed Chrome, for the rare site that only behaves there.
r-storage: >-
  Where this job's files go. Leave empty for the default folder from Settings; choose a folder when the capture belongs elsewhere, such as an external drive.

# Facebook Page capture
fb-url: >-
  The Page to capture, as it appears in the address bar. The address of a single post captures that post only.
fb-name: >-
  A label for this job in the job list and in the folder it writes to. Something you will recognise later, like the site and the month, is best. Left empty, one is made up from the target.
fb-operator: >-
  Who is running this job: your library, team or name. Written into the archive so anyone opening it later knows who made it.
fb-browser: >-
  Which Chrome does the work. Headed, a Chrome SWM manages, is the usual choice. Native attaches to your installed Chrome, for the rare site that only behaves there.
fb-storage: >-
  Where this job's files go. Leave empty for the default folder from Settings; choose a folder when the capture belongs elsewhere, such as an external drive.
fb-mode: >-
  What to collect: posts between two dates, the newest N posts, or only what has appeared since the last capture of this target.
fb-dates: >-
  The dates to keep. Posts outside this range are passed over on the way but not kept. From is required so the capture knows when to stop scrolling; To is optional.
fb-latest-n: >-
  How many of the newest posts to keep. Pinned posts sit at the top regardless of date, so they are not counted in this number.
fb-options: >-
  What to keep alongside the posts themselves: pictures and video, comments, and the raw browser traffic.
fb-comment-max: >-
  A ceiling on comments per post, so one very busy post does not take all day. The number reached is written into the record.

# Instagram capture
ig-targets: >-
  What to capture, one per line: a username, a profile address, or the address of a single post or reel. A profile collects its posts using the mode below; a post or reel address collects that item only.
ig-name: >-
  A label for this job in the job list and in the folder it writes to. Something you will recognise later, like the site and the month, is best. Left empty, one is made up from the target.
ig-operator: >-
  Who is running this job: your library, team or name. Written into the archive so anyone opening it later knows who made it.
ig-listing: >-
  How the list of a profile's posts is found. Browser scrolls the profile like a person would and needs nothing extra. gallery-dl is a separate tool that can be faster; it must be installed, and if Instagram refuses it the capture falls back to the browser.
ig-browser: >-
  Which Chrome does the work. Headed, a Chrome SWM manages, is the usual choice. Native attaches to your installed Chrome, for the rare site that only behaves there.
ig-storage: >-
  Where this job's files go. Leave empty for the default folder from Settings; choose a folder when the capture belongs elsewhere, such as an external drive.
ig-mode: >-
  What to collect: posts between two dates, the newest N posts, or only what has appeared since the last capture of this target.
ig-surfaces: >-
  Which parts of a profile to look through: the main grid of posts, the Reels tab, or both.
ig-dates: >-
  The dates to keep. Posts outside this range are passed over on the way but not kept. From is required so the capture knows when to stop scrolling; To is optional.
ig-latest-n: >-
  How many of the newest posts to keep. Pinned posts sit at the top regardless of date, so they are not counted in this number.
ig-options: >-
  What to keep alongside the posts themselves: original media, comments, and the raw browser traffic.
ig-comment-max: >-
  A ceiling on comments per post, so one very busy post does not take all day. The number reached is written into the record.
ig-reply-max: >-
  How many replies to keep under each comment, so long threads stay manageable.
x-targets: >-
  What to capture, one per line: a handle, a profile address, the address of a single post, a hashtag, or a search written as “search: words”. A profile collects the account's posts using the mode below; a post address collects that post and its conversation; a hashtag or search collects what X showed this account for it.
x-name: >-
  A label for this job in the job list and in the folder it writes to. Something you will recognise later, like the account and the month, is best. Left empty, one is made up from the targets.
x-operator: >-
  Who is running this job: your library, team or name. Written into the archive so anyone opening it later knows who made it.
x-browser: >-
  Which Chrome does the work. Headed, a Chrome SWM manages, is the usual choice. Native attaches to your installed Chrome, for the rare site that only behaves there.
x-search-product: >-
  Which results tab a hashtag or search reads. Latest lists posts newest first as X served them. Top is X's own ranked pick, which changes from one moment and account to the next.
x-storage: >-
  Where this job's files go. Leave empty for the default folder from Settings; choose a folder when the capture belongs elsewhere, such as an external drive.
x-mode: >-
  What to collect: posts between two dates, the newest N posts, everything until you stop it or the timeline stops offering new posts, or only what has appeared since the last capture of this target.
x-surfaces: >-
  Which tabs of a profile to walk: Posts, Replies, or Media. The Replies tab keeps the posts the account answered as context, so the replies make sense.
x-dates: >-
  The dates to keep. Posts outside this range are passed over on the way but not kept. From is required so the capture knows when to stop scrolling; To is optional.
x-latest-n: >-
  How many of the newest posts to keep. The pinned post sits at the top regardless of date, so it is not counted in this number.
x-options: >-
  What to keep alongside the posts: media at the best rendition X serves, reposts, each post's conversation, and the raw browser traffic.
x-reply-max: >-
  A ceiling on replies kept per post, so one very busy post does not take all day. The number reached is written into the record.

# Settings
storage-root: >-
  Where new jobs put their files. Jobs can override this location. Existing jobs are not moved.
res-cpu: >-
  Below this much spare processing power, you are asked before a new job starts. Around 15 is a sensible starting point.
res-memory: >-
  Below this much spare memory, you are asked before a new job starts. A browser needs plenty, so around 15 is sensible.
res-disk: >-
  Below this much free disk space on the folder the job writes to, you are asked before it starts. Captures can be large; 10 leaves a safety margin.
idx-java: >-
  Where Java is: the JAVA_HOME folder (the one holding bin/java) or the java executable itself. Leave empty to use JAVA_HOME or the java on the PATH. Java 11 or newer is needed to run the indexer.
idx-jar: >-
  The warc-indexer jar, built in the repository's warc-indexer folder with its Maven wrapper (.\mvnw.cmd -q -DskipTests package on Windows, ./mvnw -q -DskipTests package on Linux or macOS). Leave empty to use that build; when it is missing, the message here gives the exact command.
idx-config: >-
  The indexer configuration to run with. Leave empty for the swm-indexer.conf beside the jar, the setting the indexing was validated with.
idx-memory: >-
  The Java heap the indexer may use, such as 2g or 4g. Raise it if a run fails with an out-of-memory error on a large WARC.

# Describe this capture (all job types)
f-metadata: >-
  What this capture is, in the words a catalogue would use: a title, who made
  the site, what it is about, who holds the rights. Fill in as much or as
  little as you like; Title, Identifier, Date, Type and Collector are filled
  from the job where left empty, and each seed can have its own values. It is
  written into metadata.json and the archive, and can be changed later.
r-metadata: >-
  What this recording is, in the words a catalogue would use: a title, who
  made the site, what it is about, who holds the rights. Fill in as much or
  as little as you like; Title, Identifier, Date, Type and Collector are
  filled from the job where left empty. It is written into metadata.json and
  the archive, and can be changed later from the job list.
fb-metadata: >-
  What this Page is, in the words a catalogue would use: a title, who runs it,
  what it is about, who holds the rights. Fill in as much or as little as you
  like; Title, Identifier, Date, Type and Collector are filled from the job
  where left empty. It is written into metadata.json, the manifest and the
  archive, and can be changed later from the job list.
yt-targets: >-
  What to capture, one per line: a channel handle or address, a video address, or a playlist address. A channel collects its videos, Shorts, past streams and Posts using the mode below; a video collects that video with its files and comments; a playlist collects its items in order.
yt-name: >-
  A label for this job in the job list and in the folder it writes to. Something you will recognise later, like the channel and the month, is best. Left empty, one is made up from the targets.
yt-operator: >-
  Who is running this job: your library, team or name. Written into the archive so anyone opening it later knows who made it.
yt-browser: >-
  Which Chrome does the work when a window is needed. Headed, a Chrome SWM manages, is the usual choice. Native attaches to your installed Chrome, for the rare site that only behaves there.
yt-resolution: >-
  The largest picture size to keep for each video. Video files are big, so a cap keeps a channel capture within a disk. Metadata only keeps everything but the video files themselves.
yt-storage: >-
  Where this job's files go. Leave empty for the default folder from Settings. Choose a folder with room: a channel of videos can take hundreds of gigabytes.
yt-mode: >-
  What to collect: items between two dates, the newest N items on each surface, everything until you stop it or the listing ends, or only what has appeared since the last capture of this target.
yt-surfaces: >-
  Which parts of a channel to walk: the Videos tab, Shorts, past live streams, and the Posts tab.
yt-dates: >-
  The dates to keep. Items outside this range are passed over on the way but not kept. From is required so the capture knows when to stop; To is optional.
yt-latest-n: >-
  How many of the newest items to keep on each surface a channel has selected.
yt-files: >-
  Which files to keep beside each video: its thumbnail, the captions the uploader wrote, YouTube's automatic transcript, the live-chat replay of a past stream, and the images on Posts. The WARC option records the browser's exchanges while reading Posts.
yt-comments: >-
  Whether to keep the comments under each video and post, with a ceiling per item so one very busy video does not take all day. The record says how many YouTube reported and how many were kept.
yt-comment-max: >-
  A ceiling on comments kept per video or post. The number reached is written into the record.
yt-comment-sort: >-
  Which comments come first when the ceiling applies. Newest first gives a clear boundary in time; Top is YouTube's own ranking, which changes.
yt-metadata: >-
  What this channel, video or playlist is, in the words a catalogue would use: a title, who runs the channel, what it is about, who holds the rights. Fill in what you like; Title, Identifier, Date, Type and Collector are filled from the job.
x-metadata: >-
  What these accounts, posts or searches are, in the words a catalogue would use: a title, who runs the account, what it is about, who holds the rights. Fill in what you like; Title, Identifier, Date, Type and Collector are filled from the job.
ig-metadata: >-
  What these profiles or posts are, in the words a catalogue would use: a
  title, who runs the account, what it is about, who holds the rights. Fill
  in what you like; Title, Identifier, Date, Type and Collector are filled
  from the job where left empty, and each target can have its own values. It
  is written into metadata.json, the manifest and the archive.

# Theme-based selection (automated crawl)
theme: >-
  Keep only the pages about one topic. Each page is judged from its own text, kept or left out, and listed with the reason so the selection can be explained later. Without a theme, every page in scope is kept.
theme-ai-input: >-
  How much of a page the AI judge is sent. The default sends the address, headline and a short excerpt (a few hundred tokens per page). Address and title only is smaller; the full text asks for reasons and evidence and costs the most.
theme-name: >-
  A short name for the topic, shown on the job and written into the selection list.
theme-brief: >-
  What counts as this theme, in plain words, as you would explain it to a colleague: what is in, what is out. The AI judge reads this; it is also the best record of the collection's scope.
theme-terms: >-
  Words and phrases that mark a page as being about the theme, one per line, in any language. Arabic spelling variants and plurals are matched. A term in the headline counts most, in the section or tags next, in the text least.
theme-exclude-terms: >-
  Words that rule a page out when they appear in its headline, one per line. Useful for a neighbouring topic you do not want.
theme-url-include: >-
  Address patterns (regular expressions) that count towards the theme, one per line, such as a section path like /culture/. A match adds to the page's score; it does not keep the page by itself.
theme-url-exclude: >-
  Address patterns never fetched, one per line: log-in pages, comment feeds, calendars. These are skipped before any request is made.
theme-hubs: >-
  Address patterns for listing pages: sections, tags, search results, pagination. Hubs are always followed because they lead to theme pages, and kept as the way in unless you untick Keep hub pages.
theme-dates: >-
  Only pages published within these dates are kept, read from the page's own date where it states one. Pages without a date are judged on their content.
theme-min-score: >-
  How much evidence a page needs before the rules keep it. A term in the headline scores 3, in the section or tags 2, each mention in the text 1. Three, the default, keeps a page on one headline hit; raise it for a stricter selection.
theme-unsure: >-
  What happens to a page the judge could not place. Holding it in a review archive keeps it beside the job, out of the collection, for you to accept or drop later.
theme-stop-misses: >-
  Stop a starting page's crawl after this many pages in a row were not about the theme. 0 never stops for that reason.
theme-ai-policy: >-
  When an AI judge is configured: whether it decides every page, only the pages the rules are unsure about, or must agree with the rules before a page is kept. Its verdict, confidence and quoted evidence are recorded either way.

# Settings: the theme judge
tai-provider: >-
  Which model judges pages for themes, when a theme allows it. None means the rules decide. Anthropic sends page text to Claude over its API. Azure OpenAI uses a deployment on your own Azure resource. An OpenAI-compatible endpoint can be a local model, in which case nothing leaves this machine.
tai-endpoint: >-
  For Azure OpenAI: the resource address, such as https://my-resource.openai.azure.com. For an OpenAI-compatible provider: the base address of its API, such as http://127.0.0.1:11434/v1 for a local Ollama. Not used for Anthropic.
tai-model: >-
  The model name the provider expects, such as claude-opus-5 or the name of the local model you pulled. For Azure OpenAI this field is the deployment name: the name you gave the model when you deployed it on the resource, not the model's own name.
tai-api-version: >-
  Azure OpenAI only: the API version on the request, such as 2024-10-21. Leave empty for the default.
tai-max-prompt: >-
  The most tokens one question to the model may take, theme text and page excerpt included. At 0 it is sized from the tokens-per-minute allowance. Long link lists are asked about in several smaller questions.
tai-tpm: >-
  The tokens-per-minute allowance your provider gives this deployment. SWM paces its questions to stay under it and waits out a 429. 0 means no pacing.
tai-key: >-
  The API key, kept in this dashboard's own database and never written into a capture. Leave the field empty to keep the stored key; the server's ANTHROPIC_API_KEY environment variable is used when none is stored.
tai-max-calls: >-
  A ceiling on how many times one job may ask the model, so a runaway crawl cannot run up a bill. After it, the rules decide the rest of that job.

# Collections
job-collection: >-
  The collection this job belongs to: its files go under the collection's directory and it inherits the collection's description. Leave it on Default, pick one, or make one with New collection….
c-name: >-
  The collection's name in lists and files. Its identifier for directories and archive records is fixed when it is created, so rename freely.
c-storage: >-
  Where the collection's directory is created. Leave empty for the default folder from Settings. Every job in the collection is placed under it.
c-metadata: >-
  A description of the whole collection, in the same fields a job has. Each job inherits these values for any element it does not set itself, and carries a Relation naming the collection.
c-dedup: >-
  When on, a payload one job already holds (an image, a stylesheet, a script) is written as a revisit record pointing at that copy. A job's replay then brings in the jobs it refers to. Deleting a job others refer into leaves their pages without that content until re-crawled; the delete warning says how many.
