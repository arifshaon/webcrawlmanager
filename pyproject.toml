[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "simple-webcrawl-manager"
version = "0.5.0"
description = "Simple Webcrawl Manager (SWM): browser-based web archiving to WARC with dashboard control and in-browser replay"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "PolyForm Noncommercial License 1.0.0" }
authors = [{ name = "Arif Shaon" }]
keywords = ["web-archiving", "warc", "digital-preservation", "crawler", "replay"]
dependencies = [
    "playwright>=1.44",
    "warcio>=1.7.4",
    "PyYAML>=6.0",
    "psutil>=5.9",
]

[project.optional-dependencies]
dashboard = ["fastapi>=0.110", "uvicorn>=0.29"]
# Instagram profile listing through gallery-dl (GPL-2.0; run as a separate
# program, never imported). Only the "gallery-dl" listing choice needs it.
instagram-listing = ["gallery-dl>=1.30"]
# YouTube capture: yt-dlp lists channel tabs and playlists, reads video
# records and comments, and downloads the files (imported as a library).
# yt-dlp's own "default" extra (certifi, brotli, websockets ...) and
# curl_cffi, which it uses to impersonate a browser on requests YouTube
# answers differently otherwise.
youtube = ["yt-dlp[default,curl-cffi]>=2025.1.1"]

[project.scripts]
swm = "webarc.cli:main"
webarc = "webarc.cli:main"

[tool.setuptools]
packages = ["webarc"]

[tool.setuptools.package-data]
webarc = ["dashboard.html", "dashboard_hardening.js", "help_text.yaml"]
